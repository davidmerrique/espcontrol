# =============================================================================
# LVGL GRID - Top-layer HUD and shared button grid
# =============================================================================
# Device packages provide the screen-specific positions and grid dimensions via
# substitutions. Button behavior stays in EspControl so community packages only
# need to describe their panel layout and slot wiring.
# =============================================================================

lvgl:
  top_layer:
    widgets:
      - label:
          text: "-°C"
          id: temperatures
          text_font: font_text_body
          align: top_left
          x: ${temperature_label_x}
          y: ${temperature_label_y}
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_2
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_3
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_4
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_5
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true
      - label:
          text: "-°C"
          id: temperature_6
          text_font: font_text_body
          align: top_left
          x: 0
          y: 0
          text_color: 0xFFFFFF
          hidden: true

      - label:
          text: "--:--"
          id: display_time
          text_font: font_text_body
          align: top_mid
          x: 0
          y: ${clock_label_y}
          text_align: center
          text_color: 0xFFFFFF
          hidden: true

      - obj:
          id: network_status_button
          align: top_right
          x: ${network_status_x}
          y: ${network_status_y}
          width: ${network_status_width}
          height: ${network_status_height}
          bg_opa: 0%
          border_width: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "off"
          clickable: true
          hidden: true
          widgets:
            - label:
                id: network_status_icon_label
                text: "\U000F0928"
                text_font: font_icon_status
                align: center
                text_align: center
                text_color: 0xFFFFFF
          on_press:
            then:
              - script.execute: network_status_open_info

  pages:
    - id: main_page
      scrollbar_mode: "off"
      layout:
        type: grid
        grid_columns: ${main_page_grid_columns}
        grid_rows: ${main_page_grid_rows}
        pad_row: ${main_page_card_gap}
        pad_column: ${main_page_card_gap}
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: ${main_page_pad_top}
      pad_bottom: ${main_page_pad_bottom}
      pad_left: ${main_page_pad_left}
      pad_right: ${main_page_pad_right}
      widgets:
        - !include { file: button_widget.yaml, vars: { num: "1" } }
        - !include { file: button_widget.yaml, vars: { num: "2" } }
        - !include { file: button_widget.yaml, vars: { num: "3" } }
        - !include { file: button_widget.yaml, vars: { num: "4" } }
        - !include { file: button_widget.yaml, vars: { num: "5" } }
        - !include { file: button_widget.yaml, vars: { num: "6" } }
        - !include { file: button_widget.yaml, vars: { num: "7" } }
        - !include { file: button_widget.yaml, vars: { num: "8" } }
        - !include { file: button_widget.yaml, vars: { num: "9" } }
        - !include { file: button_widget.yaml, vars: { num: "10" } }
        - !include { file: button_widget.yaml, vars: { num: "11" } }
        - !include { file: button_widget.yaml, vars: { num: "12" } }
        - !include { file: button_widget.yaml, vars: { num: "13" } }
        - !include { file: button_widget.yaml, vars: { num: "14" } }
        - !include { file: button_widget.yaml, vars: { num: "15" } }
        - !include { file: button_widget.yaml, vars: { num: "16" } }
        - !include { file: button_widget.yaml, vars: { num: "17" } }
        - !include { file: button_widget.yaml, vars: { num: "18" } }
        - !include { file: button_widget.yaml, vars: { num: "19" } }
        - !include { file: button_widget.yaml, vars: { num: "20" } }
