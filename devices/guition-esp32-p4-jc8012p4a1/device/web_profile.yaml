# =============================================================================
# WEB PROFILE - Device-owned firmware and web layout data
# =============================================================================
# Generated by scripts/generate_device_slots.py from devices/manifest.json.
# Firmware uses the substitutions below; the browser reads the text sensor.
# =============================================================================

substitutions:
  temperature_label_x: "8"
  temperature_label_y: "5"
  clock_label_y: "5"
  network_status_x: "-16"
  network_status_y: "1"
  network_status_width: "38"
  network_status_height: "34"
  main_page_pad_bottom: "5"
  main_page_pad_left: "5"
  main_page_pad_right: "5"
  main_page_grid_columns: "[FR(1), FR(1), FR(1), FR(1), FR(1)]"
  main_page_grid_rows: "[FR(1), FR(1), FR(1), FR(1)]"

text_sensor:
  - platform: template
    name: "${entity_device_profile}"
    id: device_profile
    internal: true
    entity_category: diagnostic
    icon: "mdi:monitor-dashboard"
    update_interval: never
    lambda: |-
      return std::string(R"espcontrol_profile({"device":"guition-esp32-p4-jc8012p4a1","slots":20,"cols":5,"rows":4,"screenSize":"10.1 inches","largeSensorUnitOffsetPercent":-10,"imageCardLimit":6,"dragMode":"swap","dragAnimation":true,"features":{"screenRotation":true,"screenRotationOptions":["0","90","180","270"],"screenRotationDisplayOffset":180},"screen":{"width":"100%","aspect":"1280/800"},"portrait":{"cols":4,"rows":5,"screen":{"width":"63%","aspect":"800/1280"}},"topbar":{"height":3.59,"padding":"0.47cqw","fontSize":1.72},"grid":{"top":4.7,"compactTop":0.39,"left":0.39,"right":0.39,"bottom":0.39,"gap":0.78,"fr":"1fr"},"btn":{"radius":0.86,"padding":1.41,"iconSize":4.1,"labelSize":1.88,"labelLines":2,"labelLinesDouble":3},"emptyCell":{"radius":0.86},"sensorBadge":{"top":0.86,"right":0.86,"fontSize":1.41},"subpageBadge":{"bottom":0.86,"right":0.86,"fontSize":1.56}})espcontrol_profile");
