# =============================================================================
# WEB PROFILE - Device-owned firmware and web layout data
# =============================================================================
# Generated by scripts/generate_device_slots.py from devices/manifest.json.
# Firmware uses the substitutions below; the browser reads the text sensor.
# =============================================================================

substitutions:
  temperature_label_x: "8"
  temperature_label_y: "8"
  clock_label_y: "8"
  network_status_x: "-16"
  network_status_y: "1"
  network_status_width: "42"
  network_status_height: "38"
  main_page_pad_bottom: "5"
  main_page_pad_left: "5"
  main_page_pad_right: "5"
  main_page_grid_columns: "[FR(1), FR(1)]"
  main_page_grid_rows: "[FR(1), FR(1), FR(1)]"

text_sensor:
  - platform: template
    name: "${entity_device_profile}"
    id: device_profile
    internal: true
    entity_category: diagnostic
    icon: "mdi:monitor-dashboard"
    update_interval: never
    lambda: |-
      return std::string(R"espcontrol_profile({"device":"guition-esp32-p4-jc4880p443","slots":6,"cols":2,"rows":3,"screenSize":"4.3 inches","largeSensorUnitOffsetPercent":-10,"imageCardLimit":6,"dragMode":"displace","dragAnimation":true,"features":{"screenRotation":true,"screenRotationOptions":["0","90","180","270"],"screenRotationDisplayOffset":180},"screen":{"width":"44%","aspect":"480/800"},"portrait":{"cols":3,"rows":2,"screen":{"width":"74%","aspect":"800/480"}},"topbar":{"height":6.45,"padding":"1.2cqw 0.59cqw 0.59cqw","fontSize":4.5},"grid":{"top":8.58,"compactTop":1.5,"left":1.5,"right":1.5,"bottom":1.5,"gap":2.07,"fr":"1fr"},"btn":{"radius":1.18,"padding":2.73,"iconSize":14,"labelSize":5.5,"labelLines":2,"labelLinesDouble":3},"emptyCell":{"radius":1.18},"sensorBadge":{"top":1.52,"right":1.52,"fontSize":3.22},"subpageBadge":{"bottom":1.52,"right":1.52,"fontSize":4.03}})espcontrol_profile");
