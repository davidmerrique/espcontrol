# =============================================================================
# WEB PROFILE - Device-owned firmware and web layout data
# =============================================================================
# Generated by scripts/generate_device_slots.py from devices/manifest.json.
# Firmware uses the substitutions below; the browser reads the text sensor.
# =============================================================================

substitutions:
  temperature_label_x: "12"
  temperature_label_y: "17"
  clock_label_y: "17"
  network_status_x: "-20"
  network_status_y: "10"
  network_status_width: "44"
  network_status_height: "42"
  main_page_pad_bottom: "6"
  main_page_pad_left: "8"
  main_page_pad_right: "8"
  main_page_grid_columns: "[FR(1), FR(1), FR(1)]"
  main_page_grid_rows: "[FR(1), FR(1), FR(1)]"

text_sensor:
  - platform: template
    name: "${entity_device_profile}"
    id: device_profile
    internal: true
    entity_category: diagnostic
    icon: "mdi:monitor-dashboard"
    update_interval: never
    lambda: |-
      return std::string(R"espcontrol_profile({"device":"esp32-p4-86","slots":9,"cols":3,"rows":3,"screenSize":"4 inches","largeSensorUnitOffsetPercent":-10,"imageCardLimit":6,"coverArtSquareOverlay":true,"dragMode":"displace","dragAnimation":true,"features":{"screenRotation":true,"screenRotationOptions":["0","90","180","270"],"internalRelays":[{"key":"relay_1","label":"Relay 1"},{"key":"relay_2","label":"Relay 2"}]},"screen":{"width":"55%","aspect":"1/1"},"topbar":{"height":8.0,"padding":"1.25cqw 0.83cqw 0.83cqw","fontSize":3.75},"grid":{"top":8.33,"compactTop":0.83,"left":1.04,"right":1.04,"bottom":0.83,"gap":1.39,"fr":"1fr"},"btn":{"radius":1.67,"padding":2.92,"iconSize":9.58,"labelSize":3.96,"labelLines":2,"labelLinesDouble":3},"emptyCell":{"radius":1.67},"sensorBadge":{"top":2.08,"right":2.08,"fontSize":3.33},"subpageBadge":{"bottom":2.08,"right":2.08,"fontSize":4}})espcontrol_profile");
