# =============================================================================
# WEB PROFILE - Device-owned firmware and web layout data
# =============================================================================
# Generated by scripts/generate_device_slots.py from devices/manifest.json.
# Firmware uses the substitutions below; the browser reads the text sensor.
# =============================================================================

substitutions:
  temperature_label_x: "8"
  temperature_label_y: "8"
  clock_label_y: "8"
  network_status_x: "-4"
  network_status_y: "1"
  network_status_width: "48"
  network_status_height: "44"
  main_page_pad_bottom: "5"
  main_page_pad_left: "5"
  main_page_pad_right: "5"
  main_page_grid_columns: "[FR(1), FR(1), FR(1), FR(1), FR(1)]"
  main_page_grid_rows: "[FR(1), FR(1), FR(1)]"

text_sensor:
  - platform: template
    name: "${entity_device_profile}"
    id: device_profile
    internal: true
    entity_category: diagnostic
    icon: "mdi:monitor-dashboard"
    update_interval: never
    lambda: |-
      return std::string(R"espcontrol_profile({"device":"guition-esp32-p4-jc1060p470","slots":15,"cols":5,"rows":3,"screenSize":"7 inches","largeSensorUnitOffsetPercent":-10,"imageCardLimit":6,"dragMode":"swap","dragAnimation":true,"features":{"screenRotation":true,"screenRotationOptions":["0","90","180","270"],"screenRotationDisplayOffset":180},"screen":{"width":"100%","aspect":"1024/600"},"portrait":{"cols":3,"rows":5,"screen":{"width":"59%","aspect":"600/1024"}},"topbar":{"height":3.2,"padding":"0.39cqw","fontSize":1.95},"grid":{"top":4.4,"compactTop":0.49,"left":0.49,"right":0.49,"bottom":0.49,"gap":0.98,"fr":"1fr"},"btn":{"radius":0.78,"padding":1.37,"iconSize":4.69,"labelSize":1.8,"labelLines":2,"labelLinesDouble":3},"emptyCell":{"radius":0.78},"sensorBadge":{"top":1,"right":1,"fontSize":1.6},"subpageBadge":{"bottom":1,"right":1,"fontSize":2}})espcontrol_profile");
